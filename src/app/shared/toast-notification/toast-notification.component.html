<div class="toast-card flex items-start gap-3 rounded-lg border border-solid px-4 py-3 shadow-lg" [ngClass]="containerClass">
  <mat-icon class="toast-icon" [ngClass]="iconClass">{{ icon }}</mat-icon>
  <div class="flex flex-col gap-1">
    @if (data.title) {
    <p class="toast-title font-semibold" [ngClass]="titleClass">{{ data.title }}</p>
    }
    <p class="toast-message text-sm" [ngClass]="messageClass">{{ data.message }}</p>
  </div>
</div>
