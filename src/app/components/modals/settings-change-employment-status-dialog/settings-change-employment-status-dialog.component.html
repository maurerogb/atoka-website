<div class="">
  @if (!isSuccess) {
    <div class="flex items-start justify-between gap-4">
      <div class="flex flex-col text-[#005677] gap-2 mb-4 w-full items-center">
        <p class="font-bold text-center text-3xl text-[#003A50]">Change Employment Status</p>
        <p class="text-base text-center max-w-[480px] text-[#005677] font-semibold">
          Kindly enter your email address to receive OTP code
        </p>
      </div>
    </div>

    <form class="grid gap-4 mt-4" [formGroup]="form">
      <div class="status-row">
        <div>
          <p class="text-sm font-medium text-[#003A50]">Employment status</p>
          <p class="text-xs text-[#667085]">Current status: <span class="font-semibold">{{ statusLabel }}</span></p>
        </div>
        <div class="switch-row">
          <span class="text-xs text-[#667085]">Unemployed</span>
          <mat-slide-toggle color="primary" formControlName="employed"></mat-slide-toggle>
          <span class="text-xs text-[#667085]">Employed</span>
        </div>
      </div>
    </form>

    <div class="flex justify-center mt-6">
      <button type="button" mat-flat-button color="primary" class="w-full" (click)="submit()">
        Update
      </button>
    </div>
  } @else {
    <div class="flex flex-col items-center text-center gap-4 py-6">
      <img src="assets/images/success.png" alt="Success" class="h-20 w-auto" />
      <div>
        <p class="text-lg font-semibold text-[#003A50]">Employment status updated</p>
        <p class="text-sm text-[#667085]">Your employment status has been updated successfully.</p>
      </div>
      <button type="button" mat-flat-button color="primary" (click)="finish()">Done</button>
    </div>
  }
</div>
