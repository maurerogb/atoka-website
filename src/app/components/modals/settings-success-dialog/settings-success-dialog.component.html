<div class="dialog-card success-card">
  <div class="flex flex-col items-center text-center gap-4">
    <img src="assets/images/success.png" alt="Success" class="h-20 w-auto" />
    <div>
      <p class="text-lg font-semibold text-[#003A50]">{{ titleText }}</p>
      <p class="text-sm text-[#667085]">{{ messageText }}</p>
    </div>
    <button type="button" mat-flat-button color="primary" (click)="close()">Done</button>
  </div>
</div>
