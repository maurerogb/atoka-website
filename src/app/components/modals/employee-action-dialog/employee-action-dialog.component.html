<div class="w-[480px]">
  <div class="flex justify-end cursor-pointer" (click)="cancel()">
    <img src="assets/svg/cancel.svg" alt="" />
  </div>

  <div class="flex flex-col items-center gap-4 text-center">
    <div>
      <img [src]="iconAsset" alt="" />
    </div>
    <div>
      <p class="font-bold text-[26px] text-[#414245]">
        {{ data.title }}
      </p>
    </div>
    <p class="text-base text-[##575960]">{{ data.message }}</p>
  </div>

  @if (data.requiresReason) {
  <div class="mt-6">
    <mat-form-field class="w-full rounded-xl" appearance="fill" floatLabel="always">
      <textarea
        matInput
        rows="4"
        [formControl]="reasonControl"
        placeholder="Provide a reason for this request"
      ></textarea>
      <mat-error *ngIf="reasonControl.hasError('required') && (reasonControl.dirty || reasonControl.touched)">
        Reason is required
      </mat-error>
    </mat-form-field>
  </div>
  }

  <div class="flex flex-col md:flex-row gap-3 mt-6">
    <button type="button" mat-flat-button color="primary" class="w-full !min-w-[unset]" (click)="confirm()">
      {{ data.confirmText }}
    </button>
    <button type="button" mat-stroked-button color="primary" class="w-full !min-w-[unset]" (click)="cancel()">
      {{ data.cancelText || 'Cancel request' }}
    </button>
  </div>
</div>
