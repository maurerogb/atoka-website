<div>
  <input
    [type]="fileType"
    #fileUpload
    class="hidden"
    [attr.multiple]="multiple ? '' : null"
    (change)="uploadFile($event)"
  />

  <div *ngIf="!newFiles.length" class="grid w-full justify-center bg-[#F3F4F6] rounded-lg p-5">
    <button (click)="fileUpload.click()" type="button" class="flex gap-2 text-sm font-medium">
      <img src="assets/svg/upload.svg" alt="" />
      <span>Drag file here to upload document or <span class="font-bold">choose file</span></span>
    </button>
  </div>

  <div *ngIf="newFiles.length" class="grid gap-3">
    <div
      *ngFor="let selectedFile of newFiles; trackBy: trackByFileKey"
      class="flex items-start justify-between gap-3 rounded-lg border border-[#08875D] p-3"
    >
      <div class="flex flex-1 min-w-0 items-start gap-3">
        <mat-icon svgIcon="upload-file" [className]="'h-8'"></mat-icon>

        <div class="flex-1 min-w-0">
          <p class="truncate text-sm font-medium text-[#003A50]">{{ selectedFile.name }}</p>
          <p class="text-sm font-normal text-[#667085]">{{ formatFileSize(selectedFile.size) }}</p>

          <div class="mt-2 flex items-center gap-2">
            <div class="h-2 flex-1 overflow-hidden rounded-full bg-[#E4E7EC]">
              <div class="h-full bg-[#0090C7]" [style.width.%]="getFileProgress(selectedFile)"></div>
            </div>
            <p class="text-sm font-medium text-[#003A50]">{{ getFileProgress(selectedFile) }}%</p>
          </div>
        </div>
      </div>

      <div class="flex shrink-0 items-center gap-2">
        <span class="flex h-6 w-6 items-center justify-center rounded-full bg-[#0090C7]">
          <mat-icon class="!h-4 !w-4 !text-[16px] !leading-none !text-white">check</mat-icon>
        </span>
        <button
          type="button"
          class="flex h-6 w-6 items-center justify-center rounded-full bg-[#FEE4E2] text-[#B42318]"
          (click)="removeFile(selectedFile)"
          aria-label="Remove file"
        >
          <mat-icon class="!h-4 !w-4 !text-[16px] !leading-none">close</mat-icon>
        </button>
      </div>
    </div>

  </div>
</div>
